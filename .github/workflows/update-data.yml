name: Update FPL data

on:
  schedule:
    # Backup only - an external cron-job.org trigger calls workflow_dispatch every
    # 10 minutes for the real refresh cadence, since GitHub throttles a repo's own
    # scheduled workflow down to multi-hour gaps regardless of the cron expression.
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-fpl-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/build-data.js
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Commit and push if changed
        run: |
          git config user.name "fpl-fairplay-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update FPL data [skip ci]"
            git push
          fi
